  <text font-family="'Playfair Display', 'Times New Roman', Georgia, serif" font-size="68" font-weight="900" fill="#3B1410" letter-spacing="2">
    <textPath href="#arcMNassar" startOffset="50%" text-anchor="middle">
      M.Nassar
    </textPath>
  </text>

  <!-- 2. Real Estate -->
