<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <!-- Gradients -->
    <radialGradient id="medallionBg" cx="48%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FAF8F3" />
      <stop offset="70%" stop-color="#F3EFE6" />
      <stop offset="100%" stop-color="#E7E0D2" />
    </radialGradient>
    
    <linearGradient id="goldTreeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B58A38" />
      <stop offset="30%" stop-color="#E3BE6E" />
      <stop offset="60%" stop-color="#FBE09C" />
      <stop offset="80%" stop-color="#C89E47" />
      <stop offset="100%" stop-color="#8A651E" />
    </linearGradient>

    <radialGradient id="innerRecessShadow" cx="48%" cy="48%" r="52%">
      <stop offset="88%" stop-color="#000000" stop-opacity="0" />
      <stop offset="96%" stop-color="#1c281e" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0b140d" stop-opacity="0.6" />
    </radialGradient>

    <!-- Clip path for center recessed circle -->
    <clipPath id="centerCircleClip">
      <circle cx="500" cy="560" r="215" />
    </clipPath>

    <!-- Arc Paths for curved texts -->
    <!-- Arc 1: M.Nassar -->
    <path id="arcMNassar" d="M 160,540 A 375,375 0 0,1 840,540" fill="none" />
    <!-- Arc 2: Real Estate -->
    <path id="arcRealEstate" d="M 205,540 A 315,315 0 0,1 795,540" fill="none" />
    <!-- Arc 3: 76743414 -->
    <path id="arcPhone" d="M 260,540 A 255,255 0 0,1 740,540" fill="none" />

    <filter id="embossDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Solid Outer Ring Background -->
  <circle cx="500" cy="500" r="492" fill="#000000" />

  <!-- Outer Double Burgundy Rings with Cream Gap -->
  <circle cx="500" cy="500" r="480" fill="none" stroke="#421814" stroke-width="6" />
  <circle cx="500" cy="500" r="468" fill="none" stroke="#C89E47" stroke-width="1.5" opacity="0.7" />
  <circle cx="500" cy="500" r="462" fill="url(#medallionBg)" stroke="#421814" stroke-width="3.5" />

  <!-- Top Curved Brand Typography -->
