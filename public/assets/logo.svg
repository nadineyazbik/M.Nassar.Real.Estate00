<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c87b" />
      <stop offset="50%" stop-color="#c5a059" />
      <stop offset="100%" stop-color="#997736" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006b35" />
      <stop offset="50%" stop-color="#004d26" />
      <stop offset="100%" stop-color="#002b15" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Emblem Badge -->
  <g transform="translate(15, 10)" filter="url(#subtleGlow)">
    <rect x="5" y="5" width="110" height="110" rx="28" fill="url(#greenGrad)" stroke="url(#goldGrad)" stroke-width="3.5" />
    <rect x="12" y="12" width="96" height="96" rx="22" fill="none" stroke="#c5a059" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>

    <!-- Architectural Pillars / Building & Cedar Stylized Monogram -->
    <path d="M38 88 L38 48 L48 40 L48 88 Z" fill="url(#goldGrad)" />
    <path d="M52 88 L52 32 L60 25 L68 32 L68 88 Z" fill="#f5dfa2" />
    <path d="M72 88 L72 40 L82 48 L82 88 Z" fill="url(#goldGrad)" />

    <!-- Window Slits -->
    <rect x="56" y="38" width="8" height="4" rx="1" fill="#004d26"/>
    <rect x="56" y="47" width="8" height="4" rx="1" fill="#004d26"/>
    <rect x="56" y="56" width="8" height="4" rx="1" fill="#004d26"/>
    <rect x="56" y="65" width="8" height="4" rx="1" fill="#004d26"/>

    <rect x="41" y="52" width="5" height="3" rx="0.8" fill="#004d26"/>
    <rect x="41" y="60" width="5" height="3" rx="0.8" fill="#004d26"/>
    <rect x="74" y="52" width="5" height="3" rx="0.8" fill="#004d26"/>
    <rect x="74" y="60" width="5" height="3" rx="0.8" fill="#004d26"/>

    <!-- Lebanese Cedar Geometric Base Line -->
    <path d="M30 92 L90 92 L85 96 L35 96 Z" fill="url(#goldGrad)"/>
    <circle cx="60" cy="103" r="2.5" fill="url(#goldGrad)"/>
    <circle cx="48" cy="103" r="1.5" fill="url(#goldGrad)"/>
    <circle cx="72" cy="103" r="1.5" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography Block (Arabic & English) -->
  <g transform="translate(145, 0)">
    <text x="0" y="56" font-family="'Tajawal', 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="0">
      م. نصار العقارية
    </text>
    <circle cx="218" cy="46" r="4.5" fill="url(#goldGrad)" />
    <text x="0" y="84" font-family="'Tajawal', 'Segoe UI', Arial, sans-serif" font-size="14.5" font-weight="600" fill="url(#goldGrad)" letter-spacing="0.5">
      وساطة • استثمار • تطوير عقاري في بيروت
    </text>
    <text x="0" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#a3b899" letter-spacing="2.5">
      M. NASSAR REAL ESTATE • BEIRUT
    </text>
    <g transform="translate(260, 94)">
      <rect x="0" y="0" width="118" height="20" rx="10" fill="#004d26" stroke="#c5a059" stroke-width="1"/>
      <text x="59" y="14" font-family="'Tajawal', sans-serif" font-size="9.5" font-weight="700" fill="#f5dfa2" text-anchor="middle">سند أخضر 2400 سهم</text>
    </g>
  </g>
</svg>
